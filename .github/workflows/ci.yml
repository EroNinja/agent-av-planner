name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python tests/check_scoring.py
      - run: python tests/check_key_store.py
      - run: python tests/check_recovery_labels.py
      - run: python tests/check_agent_variants.py
      - run: python tests/check_real_logs.py
      - run: python tests/check_rcaeval.py
      - name: API end-to-end check
        run: |
          python -m uvicorn incident_response.api:app --port 8123 &
          sleep 6
          python tests/check_end_to_end.py
      - name: Offline end-to-end sweep
        run: |
          python generate_logs.py --suite --runs-per-fault 1 --noise
          python evaluate.py --arms mock: --recovery
          python analyze.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
