# Ports bind to this machine only: the API can read and change saved keys.
# AVP_WEB_PORT / AVP_API_PORT move them, e.g. to run the smoke test beside a dev stack.
services:
  backend:
    build: ./backend
    # Keys are optional: the mock provider needs none. To use real providers:
    #   docker compose --env-file backend/.env up --build
    # Each name is passed only when set (an optional env_file needs Compose 2.24+).
    environment:
      - ANTHROPIC_API_KEY
      - GROQ_API_KEY
      - GROQ_MODELS
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/outputs:/app/outputs
    ports:
      - "127.0.0.1:${AVP_API_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${AVP_WEB_PORT:-8080}:80"
