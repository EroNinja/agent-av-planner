# Ports bind to this machine only: the API can read and change saved keys.
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/outputs:/app/outputs
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
